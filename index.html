<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0c0a">
  <meta name="description" content="A rain-soaked 1940s murder mystery. Read the room, build the case, name the killer.">
  <title>Midnight Detective — The Last Call</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="atmosphere" aria-hidden="true">
    <div class="rain rain-a"></div>
    <div class="rain rain-b"></div>
    <div class="vignette"></div>
    <div class="grain"></div>
  </div>

  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Midnight Detective home">
        <span class="brand-mark">M</span>
        <span class="brand-lockup">
          <span class="brand-name">Midnight <b>Detective</b></span>
          <span class="brand-sub">Homicide Bureau · Chicago</span>
        </span>
      </a>
      <div class="top-meta">
        <span class="live-dot"></span>
        <span id="header-case">Case 0048</span>
        <span class="meta-rule"></span>
        <span>Chicago, Ill.</span>
      </div>
      <button class="ghost-btn" id="new-case" type="button" aria-label="Start a new randomized case">
        <span class="ghost-btn-icon">↻</span>
        <span class="ghost-label">New case</span>
      </button>
    </header>

    <main id="game" class="game-frame" aria-live="polite"></main>

    <footer class="footer">
      <span>Rain never cleans the streets.</span>
      <span>City Police Dept. · 1947</span>
    </footer>
  </div>

  <script src="game.js"></script>
</body>
</html>
